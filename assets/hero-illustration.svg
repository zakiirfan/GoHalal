<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="heroIllTitle">
  <title id="heroIllTitle">Ilustrasi dokumen checklist dan sertifikasi halal</title>
  <defs>
    <radialGradient id="glow1" cx="18%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#d4af6a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4af6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="78%" r="55%">
      <stop offset="0%" stop-color="#d4af6a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#d4af6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12463b"/>
      <stop offset="70%" stop-color="#0c3229"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  <rect width="1600" height="1000" fill="url(#glow1)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <!-- scattered small document/checklist icons, low opacity -->
  <g fill="none" stroke="#d4af6a" stroke-width="3" opacity="0.16">
    <g transform="translate(120,120) rotate(-8)">
      <rect x="0" y="0" width="90" height="120" rx="8"/>
      <line x1="18" y1="34" x2="72" y2="34"/>
      <line x1="18" y1="54" x2="72" y2="54"/>
      <line x1="18" y1="74" x2="50" y2="74"/>
    </g>
    <g transform="translate(1360,700) rotate(10)">
      <rect x="0" y="0" width="90" height="120" rx="8"/>
      <line x1="18" y1="34" x2="72" y2="34"/>
      <line x1="18" y1="54" x2="72" y2="54"/>
      <line x1="18" y1="74" x2="50" y2="74"/>
    </g>
    <g transform="translate(1240,140) rotate(6)">
      <rect x="0" y="0" width="70" height="94" rx="6"/>
      <line x1="14" y1="26" x2="56" y2="26"/>
      <line x1="14" y1="42" x2="56" y2="42"/>
      <line x1="14" y1="58" x2="40" y2="58"/>
    </g>
    <g transform="translate(90,760) rotate(-6)">
      <rect x="0" y="0" width="70" height="94" rx="6"/>
      <line x1="14" y1="26" x2="56" y2="26"/>
      <line x1="14" y1="42" x2="56" y2="42"/>
      <line x1="14" y1="58" x2="40" y2="58"/>
    </g>
  </g>

  <!-- large central seal / certification badge motif -->
  <g transform="translate(1080,470)" opacity="0.5">
    <circle r="230" fill="none" stroke="#d4af6a" stroke-width="3" stroke-dasharray="6 10" opacity="0.55"/>
    <circle r="185" fill="none" stroke="#d4af6a" stroke-width="2" opacity="0.35"/>
    <circle r="150" fill="#0c3229" fill-opacity="0.4" stroke="#d4af6a" stroke-width="3"/>
    <path d="M -55 5 L -18 42 L 60 -45" fill="none" stroke="#d4af6a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- large document with checklist, left-of-center -->
  <g transform="translate(430,300)">
    <rect x="0" y="0" width="360" height="460" rx="18" fill="#0c3229" fill-opacity="0.55" stroke="#d4af6a" stroke-width="3" opacity="0.85"/>
    <rect x="34" y="44" width="180" height="20" rx="6" fill="#d4af6a" opacity="0.6"/>
    <rect x="34" y="90" width="292" height="10" rx="5" fill="#faf6ec" opacity="0.25"/>
    <rect x="34" y="112" width="292" height="10" rx="5" fill="#faf6ec" opacity="0.25"/>
    <rect x="34" y="134" width="200" height="10" rx="5" fill="#faf6ec" opacity="0.25"/>

    <g transform="translate(34,180)">
      <rect width="30" height="30" rx="7" fill="none" stroke="#d4af6a" stroke-width="3"/>
      <path d="M6 15 L13 22 L25 8" fill="none" stroke="#d4af6a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="7" width="220" height="16" rx="4" fill="#faf6ec" opacity="0.3"/>
    </g>
    <g transform="translate(34,228)">
      <rect width="30" height="30" rx="7" fill="none" stroke="#d4af6a" stroke-width="3"/>
      <path d="M6 15 L13 22 L25 8" fill="none" stroke="#d4af6a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="7" width="180" height="16" rx="4" fill="#faf6ec" opacity="0.3"/>
    </g>
    <g transform="translate(34,276)">
      <rect width="30" height="30" rx="7" fill="none" stroke="#d4af6a" stroke-width="3"/>
      <path d="M6 15 L13 22 L25 8" fill="none" stroke="#d4af6a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="7" width="240" height="16" rx="4" fill="#faf6ec" opacity="0.3"/>
    </g>
    <g transform="translate(34,324)">
      <rect width="30" height="30" rx="7" fill="none" stroke="#d4af6a" stroke-width="3" opacity="0.5"/>
      <rect x="46" y="7" width="150" height="16" rx="4" fill="#faf6ec" opacity="0.18"/>
    </g>
  </g>
</svg>
