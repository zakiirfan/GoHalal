<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="heroIllTitle">
  <title id="heroIllTitle">Latar hijau tua bertekstur dokumen checklist dan sertifikasi halal</title>
  <defs>
    <radialGradient id="glow1" cx="12%" cy="18%" r="50%">
      <stop offset="0%" stop-color="#d4af6a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#d4af6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#d4af6a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d4af6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12463b"/>
      <stop offset="70%" stop-color="#0c3229"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  <rect width="1600" height="1000" fill="url(#glow1)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <!-- Dokumen/checklist samar di pojok-pojok saja, jauh dari zona teks di tengah -->
  <g fill="none" stroke="#d4af6a" stroke-width="3" opacity="0.09">
    <g transform="translate(60,60) rotate(-8)">
      <rect x="0" y="0" width="100" height="132" rx="8"/>
      <line x1="20" y1="38" x2="80" y2="38"/>
      <line x1="20" y1="60" x2="80" y2="60"/>
      <line x1="20" y1="82" x2="56" y2="82"/>
    </g>
    <g transform="translate(1440,808) rotate(9)">
      <rect x="0" y="0" width="100" height="132" rx="8"/>
      <line x1="20" y1="38" x2="80" y2="38"/>
      <line x1="20" y1="60" x2="80" y2="60"/>
      <line x1="20" y1="82" x2="56" y2="82"/>
    </g>
  </g>
  <g fill="none" stroke="#d4af6a" stroke-width="2.5" opacity="0.07">
    <g transform="translate(1470,90) rotate(7)">
      <rect x="0" y="0" width="76" height="100" rx="6"/>
      <line x1="15" y1="28" x2="60" y2="28"/>
      <line x1="15" y1="46" x2="60" y2="46"/>
    </g>
    <g transform="translate(40,860) rotate(-7)">
      <rect x="0" y="0" width="76" height="100" rx="6"/>
      <line x1="15" y1="28" x2="60" y2="28"/>
      <line x1="15" y1="46" x2="60" y2="46"/>
    </g>
  </g>

  <!-- Motif segel/sertifikasi samar di kanan bawah, di luar kolom teks -->
  <g transform="translate(1280,860)" opacity="0.14">
    <circle r="150" fill="none" stroke="#d4af6a" stroke-width="3" stroke-dasharray="6 10"/>
    <circle r="112" fill="none" stroke="#d4af6a" stroke-width="2"/>
    <path d="M -38 4 L -12 28 L 42 -30" fill="none" stroke="#d4af6a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
